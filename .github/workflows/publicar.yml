# Construye la app y la publica en GitHub Pages cada vez que cambia la rama main.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Actualización sola de la app de Android: la parte web empaquetada en un zip, más version.json.
      - name: Paquete de actualización para la app de Android
        env:
          URL_ACTUALIZACION: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/android/
          APK: https://github.com/${{ github.repository }}/releases/download/android/${{ github.event.repository.name }}.apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx vite build --mode android --outDir dist-android
          mkdir -p dist/android
          (cd dist-android && zip -qr "../dist/android/web-$VERSION.zip" .)
          # Huella SHA-256 del zip: la app la exige para aceptar la descarga.
          CHECKSUM=$(sha256sum "dist/android/web-$VERSION.zip" | cut -d' ' -f1)
          node -e "require('fs').writeFileSync('dist/android/version.json', JSON.stringify({ version: '$VERSION', url: process.env.URL_ACTUALIZACION + 'web-$VERSION.zip', checksum: '$CHECKSUM', apkMinima: require('fs').readFileSync('android/apk-minima.txt', 'utf8').trim(), apk: process.env.APK }))"
          cat dist/android/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
